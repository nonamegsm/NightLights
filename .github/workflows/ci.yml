name: CI

# Build-only sanity check on every push/PR - makes sure the .NET Framework 4.8
# WinForms project still compiles. Doesn't publish anything; see release.yml
# for that.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild NightLights.sln /t:Restore,Build /p:Configuration=Release /p:Platform="Any CPU" /m /verbosity:minimal
