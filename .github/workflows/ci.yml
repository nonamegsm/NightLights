name: CI

# Build all shipping configurations and run hardware-free regression tests.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        # AnyCPU (what CI has always built) plus the x86/x64 configs the release
        # workflow actually ships, so a platform-specific compile break shows up
        # here instead of only at release time.
        platform: ["Any CPU", x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release, ${{ matrix.platform }})
        run: msbuild NightLights.sln /t:Restore,Build /p:Configuration=Release /p:Platform="${{ matrix.platform }}" /m /verbosity:minimal

      - name: Build regression tests
        if: matrix.platform == 'Any CPU'
        run: msbuild NightLights.Tests/NightLights.Tests.csproj /t:Build /p:Configuration=Release /m /verbosity:minimal

      - name: Test schedules, module transitions, OpenRGB, and power recovery
        if: matrix.platform == 'Any CPU'
        run: ./NightLights.Tests/bin/Release/NightLights.Tests.exe
