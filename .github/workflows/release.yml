name: Release

# Builds separate x86 and x64 installers and attaches both to a GitHub Release -
# triggered by pushing a tag like "v1.0.0".
#
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0) - only used for a manual run'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $parts = @($version.Split('.') + '0','0','0','0')
          $assemblyVersion = ($parts[0..3] -join '.')
          "version=$version"                 >> $env:GITHUB_OUTPUT
          "assemblyVersion=$assemblyVersion"  >> $env:GITHUB_OUTPUT

      - name: Stamp assembly version
        shell: pwsh
        run: |
          $path = "NightLights/Properties/AssemblyInfo.cs"
          $v = "${{ steps.version.outputs.assemblyVersion }}"
          (Get-Content $path) `
            -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$v`")" `
            -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$v`")" |
            Set-Content $path

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release, ${{ matrix.arch }})
        run: msbuild NightLights.sln /t:Restore,Build /p:Configuration=Release /p:Platform=${{ matrix.arch }} /m /verbosity:minimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (${{ matrix.arch }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DBuildArch=${{ matrix.arch }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/NightLights-Setup-${{ matrix.arch }}-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NightLights v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            Pick the installer matching your Windows install (not sure? almost every PC bought since ~2010 is x64):

            - **`NightLights-Setup-x64-*.exe`** - for 64-bit Windows (the vast majority of PCs, and required if you also want MSI motherboard RGB control - MSI only ships an x64 Mystic Light SDK).
            - **`NightLights-Setup-x86-*.exe`** - for 32-bit Windows.

            Either way: no admin rights needed, adds Start Menu/desktop shortcuts and a clean uninstaller.

            See the README for how to enable MSI motherboard RGB control (requires MSI's Mystic Light SDK DLL, not bundled here).
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
